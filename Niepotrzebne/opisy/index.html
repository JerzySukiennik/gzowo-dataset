<!doctype html>
<!-- Gzowo Dataset describe tool: preview new photos and videos and fill in their descriptions, saved locally on every change. -->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gzowo Dataset · nowe media</title>
<style>
:root{--ink:#141414;--mute:#73726c;--line:#e9e8e3;--soft:#f6f5f1;--acc:#FF6A13;--err:#c8321e}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1120px;margin:0 auto;padding:56px 24px 140px}
.k{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);margin:0}
h1{font:700 clamp(40px,7vw,64px)/1 -apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;letter-spacing:-.035em;margin:10px 0 16px}
.lead{font-size:19px;line-height:1.45;color:#2b2b29;max-width:40em;margin:0}
code{font:14px "SF Mono",ui-monospace,Menlo,monospace;background:var(--soft);border-radius:6px;padding:2px 7px;word-break:break-all}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;margin:34px -24px 22px;padding:12px 24px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
.count{font-size:15px;color:var(--mute)}
.count b{color:var(--ink);font-weight:650}
.seg{display:inline-flex;background:var(--soft);border-radius:99px;padding:3px}
.seg button{font:500 14px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:var(--mute);background:none;border:0;border-radius:99px;padding:6px 15px;cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.card{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:28px;border:1px solid var(--line);border-radius:22px;padding:22px;margin:0 0 18px;transition:opacity .25s}
.card.skip{opacity:.5}
.card.hidden{display:none}
.card.note{display:block}
.media{min-width:0}
.media img,.media video{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;background:var(--soft);border-radius:14px}
.wait{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;background:var(--soft);border-radius:14px;color:var(--mute);font-size:14px;text-align:center;padding:20px}
.meta{font-size:13px;color:var(--mute);margin:10px 2px 0;word-break:break-all}
.form{min-width:0;display:flex;flex-direction:column;gap:14px}
.f{display:block}
.f>span{display:block;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin:0 0 6px 2px}
.f>span i{font-style:normal;text-transform:none;letter-spacing:0;margin-left:6px}
input[type=text],textarea{display:block;width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:11px;padding:10px 12px;outline:0;transition:background .15s,border-color .15s}
input[type=text]:focus,textarea:focus{background:#fff;border-color:var(--ink)}
textarea{resize:none;min-height:92px;overflow:hidden}
::placeholder{color:#a9a8a2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:99px;padding:4px 11px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.chip:hover{border-color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{margin:8px 2px 0;padding:2px 0 2px 12px;border-left:2px solid var(--acc);font-size:14px;color:#55544f}
.hint b{display:block;font-size:11.5px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);margin-bottom:2px}
.hint button{font:500 13px -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px 11px;margin-top:6px;cursor:pointer;transition:border-color .15s}
.hint button:hover{border-color:var(--ink)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:2px}
.sk{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);cursor:pointer}
.sk input{width:16px;height:16px;accent-color:var(--ink);margin:0}
.st{font-size:13px;color:var(--mute);min-height:1em}
.st.err{color:var(--err)}
.empty{border:1px dashed #d6d4cc;border-radius:22px;padding:56px 28px;text-align:center;color:var(--mute);font-size:17px}
.empty b{display:block;color:var(--ink);font-size:21px;margin-bottom:8px}
@media (max-width:820px){.card{grid-template-columns:1fr;gap:18px;padding:16px}.bar{margin-left:-24px;margin-right:-24px}main{padding-top:36px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<p class="k">Gzowo Dataset</p>
<h1>Nowe media</h1>
<p class="lead">Wrzucaj zdjęcia i filmy do folderu <code id="inbox"></code>. Pojawią się tutaj same. Dopisz, co pamiętasz, wszystko zapisuje się od razu.</p>
<div class="bar"><div class="count" id="count"></div><div class="seg"><button type="button" class="on" data-f="all">Wszystkie</button><button type="button" data-f="todo">Do opisania</button></div></div>
<div id="list"></div>
<div class="empty" id="empty" hidden><b>Jeszcze nic tu nie ma</b>Wrzuć pliki albo cały folder (może być też zip) do folderu powyżej.</div>
</main>
<script>
const $ = (s, r = document) => r.querySelector(s)
const list = $('#list'), cards = new Map(), timers = new Map()
let data = { saved: {}, people: [], places: [] }, filter = 'all', started = false, timer = 0
const schedule = ms => { clearTimeout(timer); timer = setTimeout(tick, ms) }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const mb = n => n > 1e6 ? (n / 1e6).toFixed(n > 1e7 ? 0 : 1) + ' MB' : Math.max(1, Math.round(n / 1e3)) + ' kB'
const parts = v => v.split(',').map(x => x.trim()).filter(Boolean)

function fields(card) {
  const o = { skip: $('[name=skip]', card)?.checked || false }
  for (const n of ['title', 'story', 'who', 'where', 'when']) o[n] = $(`[name=${n}]`, card)?.value.trim() || ''
  return o
}

function done(card) {
  const f = fields(card)
  return !!(f.title || f.story || f.skip)
}

function count() {
  const all = [...cards.values()].filter(c => !c.classList.contains('note'))
  const n = all.filter(done).length
  $('#count').innerHTML = all.length ? `Opisane <b>${n}</b> z <b>${all.length}</b>` : ''
  $('#empty').hidden = all.length > 0 || !started
}

function grow(t) {
  t.style.height = 'auto'
  if (t.value && t.clientWidth > 80) t.style.height = t.scrollHeight + 2 + 'px'
}

function growAll() {
  for (const t of document.querySelectorAll('textarea')) grow(t)
}

function syncChips(card) {
  for (const box of card.querySelectorAll('.chips')) {
    const have = parts($(`[name=${box.dataset.for}]`, card).value)
    for (const c of box.children) c.classList.toggle('on', have.includes(c.textContent))
  }
}

function save(card) {
  const id = card.dataset.id, st = $('.st', card)
  clearTimeout(timers.get(id))
  st.className = 'st'
  st.textContent = 'Zapisuję…'
  timers.set(id, setTimeout(async () => {
    try {
      const r = await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id, fields: fields(card) }) })
      if (!r.ok) throw 0
      st.textContent = 'Zapisano'
    } catch {
      st.className = 'st err'
      st.textContent = 'Nie zapisano, sprawdź czy serwer działa'
    }
  }, 500))
}

function wire(card) {
  card.addEventListener('input', e => {
    if (e.target.tagName === 'TEXTAREA') grow(e.target)
    card.dataset.touched = '1'
    if (e.target.name === 'when') card.dataset.dated = '1'
    card.classList.toggle('skip', !!$('[name=skip]', card)?.checked)
    syncChips(card)
    count()
    save(card)
  })
  card.addEventListener('click', e => {
    if (e.target.closest('.use')) {
      const t = $('[name=story]', card), h = card.dataset.hinted || ''
      if (!t.value.includes(h)) t.value = t.value ? t.value.trimEnd() + '\n' + h : h
      t.dispatchEvent(new Event('input', { bubbles: true }))
      t.focus()
      return
    }
    const chip = e.target.closest('.chip')
    if (!chip) return
    const input = $(`[name=${chip.parentNode.dataset.for}]`, card)
    const have = parts(input.value), name = chip.textContent
    input.value = (have.includes(name) ? have.filter(x => x !== name) : [...have, name]).join(', ')
    input.dispatchEvent(new Event('input', { bubbles: true }))
  })
}

function mediaHTML(it) {
  if (it.preview === 'error') return '<div class="wait">Nie udało się zrobić podglądu tego pliku</div>'
  if (it.preview !== 'ready') return `<div class="wait">Przygotowuję podgląd${it.kind === 'video' ? ' filmu' : ''}…</div>`
  const u = `/preview/${it.key}`
  return it.kind === 'video'
    ? `<video controls playsinline preload="none" poster="${u}.poster.jpg" src="${u}.mp4"></video>`
    : `<a href="${u}.jpg" target="_blank" rel="noopener"><img src="${u}.jpg" alt="${esc(it.name)}" loading="lazy"></a>`
}

function metaText(it) {
  return [it.id, it.kind === 'video' ? 'film' : 'zdjęcie', mb(it.size), it.duration ? it.duration + ' s' : ''].filter(Boolean).join(' · ')
}

function chipsHTML(names, key) {
  return `<div class="chips" data-for="${key}">${names.map(n => `<button type="button" class="chip">${esc(n)}</button>`).join('')}</div>`
}

function build(it) {
  const s = data.saved[it.id] || {}
  const card = document.createElement('article')
  card.className = 'card'
  card.dataset.id = it.id
  card.dataset.state = it.preview + it.key
  card.innerHTML = `<div class="media"><div class="pv">${mediaHTML(it)}</div><p class="meta">${esc(metaText(it))}</p></div>
<div class="form">
<label class="f"><span>Tytuł</span><input type="text" name="title" placeholder="np. Rysio na SUPie" value="${esc(s.title || '')}"></label>
<div class="f"><span>Co tu się dzieje?</span><textarea name="story" placeholder="Wspomnienie, historia, żart, cokolwiek pamiętasz">${esc(s.story || '')}</textarea><div class="hintbox"></div></div>
<div class="f"><span>Kto</span><input type="text" name="who" placeholder="Kto jest w kadrze" value="${esc(s.who || '')}">${chipsHTML(data.people, 'who')}</div>
<div class="f"><span>Gdzie<i class="gsrc"></i></span><input type="text" name="where" placeholder="Miejsce" value="${esc(s.where || '')}">${chipsHTML(data.places, 'where')}</div>
<label class="f"><span>Kiedy<i class="dsrc"></i></span><input type="text" name="when" placeholder="np. lato 2023" value="${esc(s.when || '')}"></label>
<div class="foot"><label class="sk"><input type="checkbox" name="skip"${s.skip ? ' checked' : ''}>Nie dodawaj do datasetu</label><span class="st"></span></div>
</div>`
  if (s.title || s.story || s.who || s.where || s.when || s.skip) card.dataset.touched = '1'
  card.classList.toggle('skip', !!s.skip)
  wire(card)
  return card
}

function fillHint(card, it) {
  const h = data.hints && data.hints[it.id]
  if (!h || card.dataset.hinted === h.story) return
  card.dataset.hinted = h.story
  $('.hintbox', card).innerHTML = `<div class="hint"><b>Claude widzi</b>${esc(h.story)}<br><button type="button" class="use">Wstaw do opisu</button></div>`
  if (h.title) $('[name=title]', card).placeholder = 'np. ' + h.title
}

function fillDate(card, it) {
  const input = $('[name=when]', card)
  if (it.date && !input.value && !card.dataset.dated) {
    input.value = it.date
    card.dataset.dated = '1'
    $('.dsrc', card).textContent = it.dateSource
  }
}

function noteCard() {
  const s = data.saved._notatka || {}
  const card = document.createElement('article')
  card.className = 'card note'
  card.dataset.id = '_notatka'
  card.innerHTML = `<div class="form"><label class="f"><span>Notatka do całej paczki</span><textarea name="story" placeholder="Coś, co dotyczy wszystkich tych plików: skąd są, z jakiego wyjazdu, kto je robił">${esc(s.story || '')}</textarea></label><div class="foot"><span></span><span class="st"></span></div></div>`
  wire(card)
  return card
}

function applyFilter() {
  for (const c of cards.values()) c.classList.toggle('hidden', filter === 'todo' && !c.classList.contains('note') && done(c))
}

async function tick() {
  let next = 8000
  try {
    const r = await (await fetch('/api/list')).json()
    data.hints = r.hints
    if (!started) {
      data = r
      $('#inbox').textContent = r.inbox.replace(/^\/Users\/[^/]+/, '~')
    }
    const order = [...r.items].sort((a, b) => (a.date || '9').localeCompare(b.date || '9') || a.id.localeCompare(b.id, 'pl', { numeric: true }))
    if (order.length && !cards.has('_notatka')) {
      const n = noteCard()
      cards.set('_notatka', n)
      list.append(n)
      grow($('textarea', n))
    }
    const ids = new Set(order.map(i => i.id))
    for (const it of order) {
      let card = cards.get(it.id)
      if (!card) {
        card = build(it)
        cards.set(it.id, card)
        list.append(card)
        grow($('textarea', card))
        syncChips(card)
        if (filter === 'todo' && done(card)) card.classList.add('hidden')
      } else if (card.dataset.state !== it.preview + it.key) {
        card.dataset.state = it.preview + it.key
        $('.pv', card).innerHTML = mediaHTML(it)
      }
      $('.meta', card).textContent = metaText(it)
      $('.gsrc', card).textContent = it.gps ? 'GPS z pliku: ' + it.gps : ''
      fillDate(card, it)
      fillHint(card, it)
    }
    for (const [id, card] of cards) {
      if (id !== '_notatka' && !ids.has(id)) {
        if (card.dataset.touched) $('.meta', card).textContent = id + ' · plik zniknął z folderu'
        else { card.remove(); cards.delete(id) }
      }
    }
    started = true
    count()
    if (!order.length || order.some(i => i.preview === 'pending' || i.date === null)) next = 2500
  } catch {
    next = 5000
  }
  if (!document.hidden) schedule(next)
}

document.addEventListener('visibilitychange', () => { if (!document.hidden) { growAll(); schedule(0) } })
let rz = 0
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(growAll, 150) })
for (const b of document.querySelectorAll('.seg button')) b.addEventListener('click', () => {
  filter = b.dataset.f
  for (const x of document.querySelectorAll('.seg button')) x.classList.toggle('on', x === b)
  applyFilter()
})
tick()
</script>
</body>
</html>
